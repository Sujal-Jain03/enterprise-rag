services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_CLUSTER_ENDPOINT=http://qdrant:6333
    depends_on:
      - qdrant
  ui:
    build: .
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0 #http://localhost:8501
    ports:
      - "8501:8501"
    environment:
      - RAG_API_URL=http://api:8000
    depends_on:
      - api

volumes:
  qdrant_storage:
    external: true
